[build-system]
requires = [
    "setuptools>=80",
    "setuptools_scm[toml]>=8",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "refstis"
dynamic = ["version"]

description = "Routines to create STIS CCD superdarks and superbiases"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Allyssa Riley"},
    {name = "Sean Lockwood"},
    {name = "Justin Ely"},
]

keywords = ["astronomy"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "stistools",
]

[project.urls]
Homepage = "https://refstis.readthedocs.io"
Documentation = "https://refstis.readthedocs.io"

[project.scripts]
basejoint = "refstis.basejoint:call_make_basebias"
basedark = "refstis.basedark:call_make_basedark"
refbias = "refstis.refbias:call_make_refbias"
weekbias = "refstis.weekbias:call_make_weekbias"
weekdark = "refstis.weekdark:call_make_weekdark"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov",
]

docs = [
    "sphinx>=8",
    "sphinx-rtd-theme",
]

dev = [
    "refstis[test,docs]",
]

[tool.setuptools]
packages = ["refstis"]
include-package-data = true

[tool.setuptools_scm]
version_file = "refstis/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
]
filterwarnings = [
    "ignore:.*GFIT is deprecated.*",
    "ignore:.*NMPFIT is deprecated.*",
]

[tool.pytest_env]
oref = "tests/oref/"
